<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#2563eb"/>
  
  <!-- Robot antenna -->
  <line x1="16" y1="6" x2="16" y2="9" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="5" r="1.5" fill="white"/>
  
  <!-- Robot head/body (even bigger and rounder) -->
  <rect x="7" y="9" width="18" height="16" rx="4.5" fill="white"/>
  
  <!-- Small ears on sides (taller) -->
  <rect x="5" y="13" width="2" height="6" rx="1" fill="white"/>
  <rect x="25" y="13" width="2" height="6" rx="1" fill="white"/>
  
  <!-- Robot eyes -->
  <circle cx="12" cy="16" r="1.8" fill="#2563eb"/>
  <circle cx="20" cy="16" r="1.8" fill="#2563eb"/>
  
  <!-- Robot mouth/display -->
  <rect x="10" y="21" width="12" height="2.5" rx="1.25" fill="#2563eb"/>
</svg>